services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - MODEL_PATH=models/best_model.pt
      - MODELS_DIR=models
      - DATA_PATH=data
      - DEVICE=cpu
      - CORS_ORIGINS=http://localhost:3000
    networks:
      - sudoku-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sudoku-net

networks:
  sudoku-net:
    driver: bridge
